# Pre-commit hooks for Yala (Python backend + SvelteKit dashboard).
# Install: pre-commit install
# Run over the whole tree: pre-commit run --all-files
exclude: |
  (?x)^(
    dashboard/build/|
    dashboard/\.svelte-kit/|
    dashboard/node_modules/|
    build/|
    .*\.egg-info/
  )

repos:
  # ---------------------------- Filesystem hygiene ---------------------------- #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      # Lightweight secret guards borrowed from the DLC config.
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]

  # -------------------------------- Python ----------------------------------- #
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        name: ruff (lint + fix)
        args: ["--fix"]
        files: ^(src|tests|scripts)/.*\.py$
      - id: ruff-format
        name: ruff (format)
        files: ^(src|tests|scripts)/.*\.py$

  # ------------------------------- Frontend ----------------------------------- #
  - repo: local
    hooks:
      - id: prettier-dashboard
        name: prettier (dashboard)
        entry: bash -c 'cd dashboard && npm run format'
        language: system
        pass_filenames: false
        files: ^dashboard/.*\.(ts|svelte|js|json|css|html)$
        exclude: ^dashboard/(build/|\.svelte-kit/|node_modules/|static/data\.json$)

  # --------------------------- Schema freshness ------------------------------- #
  - repo: local
    hooks:
      - id: schema-freshness
        name: schema freshness (schemas/ must match pydantic models)
        entry: bash -c 'python scripts/generate_schema.py && if ! git diff --exit-code -- schemas/; then echo "schemas/ is stale — run scripts/generate_schema.py and re-add"; exit 1; fi'
        language: system
        pass_filenames: false
        files: ^(src/yala/schema\.py|scripts/generate_schema\.py)$
