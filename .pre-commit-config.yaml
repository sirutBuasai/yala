# Pre-commit hooks for Yala (Python backend + SvelteKit dashboard).
# Install: pre-commit install
# Run over the whole tree: pre-commit run --all-files

default_stages:
  - pre-commit
  - manual

minimum_pre_commit_version: "3.0.0"

repos:
  # ---------------------------------------------------------------------------- #
  #                              🧹 Filesystem Hygiene                           #
  # ---------------------------------------------------------------------------- #

  ### Pre-commit First-Party Tools ###
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
  # ------------------------------- 🌳 Git Tools ------------------------------- #
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
  # ---------------------------- 📁 Filesystem Tools --------------------------- #
      - id: trailing-whitespace
        name: "📁 filesystem/📝 file · Validate empty whitespaces"
      - id: end-of-file-fixer
        name: "📁 filesystem/📝 file · Fix end of files"
      - id: mixed-line-ending
        name: "📁 filesystem/📝 file · Normalize line endings"
        args: ["--fix=lf"]
      - id: check-added-large-files
        name: "📁 filesystem/📝 file · Block large files"
      - id: check-json
        name: "📁 filesystem/🔧 config · Validate JSON file"
      - id: check-yaml
        name: "📁 filesystem/🔧 config · Validate YAML file"
  # ----------------------------- 🔒 Security Tools ---------------------------- #
      - id: detect-private-key
        name: "🔒 security · Detect private keys"
      - id: detect-aws-credentials
        name: "🔒 security · Detect aws credentials"
        args: ["--allow-missing-credentials"]

  # ---------------------------------------------------------------------------- #
  #                              🔍 Code Quality Tools                           #
  # ---------------------------------------------------------------------------- #

  ### Python Tools ###
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        name: "🐍 python · Lint python"
        args: ["--fix"]
      - id: ruff-format
        name: "🐍 python · Format python"

  ### Frontend Tools ###
  - repo: local
    hooks:
      - id: prettier-web
        name: "💅 prettier · Format web"
        entry: bash -c 'cd apps/web && npm run format'
        language: system
        pass_filenames: false

  ### Schema Tools ###
  - repo: local
    hooks:
      - id: schema-freshness
        name: "📐 schema · Validate schema freshness"
        entry: bash -c 'make gen && if ! git diff --exit-code -- packages/contract/ apps/web/src/lib/types.ts; then echo "contract is stale — run \"make gen\" then \"git add packages/contract/ apps/web/src/lib/types.ts\" and commit"; exit 1; fi'
        language: system
        pass_filenames: false
