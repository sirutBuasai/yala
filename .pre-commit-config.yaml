# Pre-commit hooks for Yala (Python backend + SvelteKit dashboard).
# Install: pre-commit install
# Run over the whole tree: pre-commit run --all-files

default_stages:
  - pre-commit
  - manual

minimum_pre_commit_version: "3.0.0"

exclude: |
  (?x)^(
    apps/web/build/|
    apps/web/\.svelte-kit/|
    apps/web/node_modules/|
    apps/api/build/|
    .*\.egg-info/
  )

repos:
  # ---------------------------------------------------------------------------- #
  #                              🧹 Filesystem Hygiene                           #
  # ---------------------------------------------------------------------------- #

  ### Pre-commit First-Party Tools ###
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
  # ------------------------------- 🌳 Git Tools ------------------------------- #
      - id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
  # ---------------------------- 📁 Filesystem Tools --------------------------- #
      - id: trailing-whitespace
        name: "📁 filesystem/📝 file · Validate empty whitespaces"
      - id: end-of-file-fixer
        name: "📁 filesystem/📝 file · Fix end of files"
      - id: mixed-line-ending
        name: "📁 filesystem/📝 file · Normalize line endings"
        args: ["--fix=lf"]
      - id: check-added-large-files
        name: "📁 filesystem/📝 file · Block large files"
      - id: check-json
        name: "📁 filesystem/🔧 config · Validate JSON file"
      - id: check-yaml
        name: "📁 filesystem/🔧 config · Validate YAML file"
  # ----------------------------- 🔒 Security Tools ---------------------------- #
      - id: detect-private-key
        name: "🔒 security · Detect private keys"
      - id: detect-aws-credentials
        name: "🔒 security · Detect aws credentials"
        args: ["--allow-missing-credentials"]

  # ---------------------------------------------------------------------------- #
  #                              🔍 Code Quality Tools                           #
  # ---------------------------------------------------------------------------- #

  ### Python Tools ###
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
        name: "🐍 python · Lint python"
        args: ["--fix"]
        files: ^apps/api/(src|tests|scripts)/.*\.py$
      - id: ruff-format
        name: "🐍 python · Format python"
        files: ^apps/api/(src|tests|scripts)/.*\.py$

  ### Frontend Tools ###
  - repo: local
    hooks:
      - id: prettier-web
        name: "💅 prettier · Format web"
        entry: bash -c 'cd apps/web && npm run format'
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.(ts|svelte|js|json|css|html)$
        exclude: ^apps/web/(build/|\.svelte-kit/|node_modules/|static/data\.json$)

  ### Schema Tools ###
  - repo: local
    hooks:
      - id: schema-freshness
        name: "📐 schema · Validate schema freshness"
        entry: bash -c 'cd apps/api && python scripts/generate_schema.py && cd ../.. && if ! git diff --exit-code -- packages/contract/; then echo "packages/contract/ is stale — run apps/api/scripts/generate_schema.py and re-add"; exit 1; fi'
        language: system
        pass_filenames: false
        files: ^apps/api/(src/yala/schema\.py|scripts/generate_schema\.py)$
