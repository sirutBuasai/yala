[project]
name = "yala"
version = "0.1.0"
description = "Yala -- private, local-first personal finance backend (beancount source of truth)."
requires-python = ">=3.10"
dependencies = [
    "beancount>=3.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.14", "pre-commit>=4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # Third-party: starlette's TestClient warns that it uses httpx (wants httpx2). Not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
